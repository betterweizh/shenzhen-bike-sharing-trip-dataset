[project]
name = "shenzhen-bike-sharing"
version = "0.1.0"
description = "Preprocessing and exploration of Shenzhen dockless bike-sharing trips"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [
    { name = "WZ" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
shenzhen-bike-sharing = "shenzhen_bike_sharing:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ['tests']
